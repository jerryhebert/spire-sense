name: CI

# Not active until this repository has a GitHub remote. Nothing here needs the game installed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # --locked-mode fails if the resolved dependency graph differs from the committed lock file,
      # so a dependency cannot change without that change appearing in the diff.
      - name: Restore (locked)
        run: dotnet restore tests/SpireSense.Tests/SpireSense.Tests.csproj --locked-mode

      - name: Test
        run: dotnet test tests/SpireSense.Tests/SpireSense.Tests.csproj --no-restore --verbosity normal

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Fails the build on any known vulnerability, deprecated package, or floating version range.
      - name: Audit dependencies
        shell: pwsh
        run: ./scripts/Audit-Dependencies.ps1

      # The mod project cannot be compiled here: it links the game's own assemblies, which are not
      # redistributable and are therefore not in this repository. Restoring it is enough to audit it.
      - name: Verify mod lock file is current
        run: dotnet restore SpireSense/SpireSense.csproj --locked-mode
